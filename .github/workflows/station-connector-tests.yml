name: Station Connector Tests

on:
  push:
    branches: [feature/operations-modules]
    paths:
      - "station-connector/**"
      - ".github/workflows/station-connector-tests.yml"
  pull_request:
    branches: [feature/operations-modules]
    paths:
      - "station-connector/**"
      - ".github/workflows/station-connector-tests.yml"

jobs:
  mapping-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check connector and comparison tool syntax
        working-directory: station-connector
        run: python -m py_compile connector.py compare_db.py
      - name: Run connector mapping tests
        working-directory: station-connector
        run: python -m unittest discover -s tests -v
