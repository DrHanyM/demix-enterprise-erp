name: DeMix Clerk MCP OAuth Tests

on:
  push:
    branches:
      - feature/clerk-oauth-mcp
      - cimd/clerk-inspector-metadata
    paths:
      - "demix-clerk-mcp/**"
      - ".github/workflows/demix-clerk-mcp-oauth.yml"
  workflow_dispatch:
  pull_request:
    branches:
      - preview
      - feature/clerk-oauth-mcp

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: true
    defaults:
      run:
        working-directory: demix-clerk-mcp
    steps:
      - name: Checkout pull request revision
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: demix-clerk-mcp/package-lock.json

      - name: Install exactly from lockfile
        run: npm ci

      - name: Check server syntax
        run: node --check server.mjs

      - name: Run OAuth, metadata, and HTTP smoke tests
        run: npm test
